name: Build Reynard

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Git ref to build
        required: true
        type: string
      nightly:
        description: Build nightly version
        required: false
        default: false
        type: boolean
      build_normal_ipa:
        description: Build normal IPA
        required: false
        default: true
        type: boolean
      build_trollstore_tipa:
        description: Build TrollStore TIPA
        required: false
        default: true
        type: boolean
      build_jailbroken_ipa:
        description: Build Jailbroken IPA
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  prepare:
    name: Select build variants
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      should_build: ${{ steps.matrix.outputs.should_build }}
    steps:
      - name: Select matrix
        id: matrix
        uses: actions/github-script@v9
        env:
          BUILD_NORMAL_IPA: ${{ inputs.build_normal_ipa }}
          BUILD_TROLLSTORE_TIPA: ${{ inputs.build_trollstore_tipa }}
          BUILD_JAILBROKEN_IPA: ${{ inputs.build_jailbroken_ipa }}
        with:
          script: |
            const variants = [];

            if (
              process.env.BUILD_NORMAL_IPA === 'true' ||
              process.env.BUILD_TROLLSTORE_TIPA === 'true'
            ) {
              variants.push({
                variant: 'standard',
                build_args: '--use-sccache --auto-clobber',
                sccache_namespace: 'standard',
              });
            }

            if (
              process.env.BUILD_JAILBROKEN_IPA === 'true'
            ) {
              variants.push({
                variant: 'nojemalloc',
                build_args: '--disable-jemalloc --use-sccache --auto-clobber',
                sccache_namespace: 'nojemalloc',
              });
            }

            core.setOutput('matrix', JSON.stringify({ include: variants }));
            core.setOutput('should_build', String(variants.length > 0));

  build:
    needs: prepare
    if: ${{ needs.prepare.outputs.should_build == 'true' }}
    name: "${{ matrix.variant == 'standard' && 'Build standard engine and SideStore IPA' || 'Build Jailbroken' }}"
    runs-on: macos-26
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: ${{ matrix.sccache_namespace }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref }}
          fetch-depth: 0
          submodules: false

      - name: Set up latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Source policy and localization checks
        run: node --test tests/*.test.mjs

      - name: Test local tab group persistence
        run: |
          xcrun swiftc browser/Reynard/Client/TabManagement/TabGroupStore.swift tests/tab-groups.test.swift -o "$RUNNER_TEMP/test-tab-groups"
          "$RUNNER_TEMP/test-tab-groups"

      - name: Parse Swift sources before compiling Gecko
        run: find browser -name '*.swift' -print0 | xargs -0 xcrun swiftc -frontend -parse

      - name: UIKit homepage first-frame smoke test (no Gecko)
        timeout-minutes: 8
        run: bash tools/Test-HomepageLayout.sh

      - name: Install build dependencies
        run: |
          brew install python@3.12 lld cbindgen llvm
          echo "$(brew --prefix python@3.12)/libexec/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Initialize submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive support/idevice
          git submodule update --init --depth 1 engine/firefox

      - name: Update Gecko source
        run: ./tools/development/update-gecko.sh

      - name: Apply Gecko patches
        run: ./tools/development/apply-patches.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Hash Rust toolchain for cache
        id: rust_toolchain
        run: |
          echo "hash=$(rustc -Vv | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "xcode_hash=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "engine_sha=$(git rev-parse HEAD:engine/firefox)" >> "$GITHUB_OUTPUT"

      - name: Restore Gecko dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.mozbuild
          key: buildcache-gecko-deps-${{ matrix.variant }}-${{ steps.rust_toolchain.outputs.hash }}-${{ hashFiles('engine/release.txt') }}
          restore-keys: |
            buildcache-gecko-deps-${{ matrix.variant }}-${{ steps.rust_toolchain.outputs.hash }}-

      - name: Restore idevice build cache
        uses: actions/cache@v4
        with:
          path: |
            support/idevice/target
            browser/Reynard/JIT/RPPairing/libidevice_ffi.a
          key: buildcache-idevice-${{ steps.rust_toolchain.outputs.hash }}-${{ hashFiles('support/idevice/Cargo.lock', 'support/idevice/Cargo.toml', 'tools/development/build-idevice.sh') }}
          restore-keys: |
            buildcache-idevice-${{ steps.rust_toolchain.outputs.hash }}-

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      # Save a self-contained, dereferenced engine SDK before building the UI.
      # If a Swift type error occurs, fixing UI code need not rebuild Gecko.
      - name: Restore packaged Gecko SDK
        id: gecko_dist
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/reynard-gecko-dist.tar.gz
          key: gecko-sdk-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.variant }}-${{ steps.rust_toolchain.outputs.engine_sha }}-${{ steps.rust_toolchain.outputs.xcode_hash }}-${{ steps.rust_toolchain.outputs.hash }}-${{ hashFiles('engine/release.txt', 'patches/**', 'tools/development/build-gecko.sh') }}

      - name: Extract cached Gecko SDK
        if: steps.gecko_dist.outputs.cache-hit == 'true'
        run: |
          mkdir -p engine/firefox/obj-aarch64-apple-ios/dist
          tar -xzf "$RUNNER_TEMP/reynard-gecko-dist.tar.gz" -C engine/firefox/obj-aarch64-apple-ios/dist
          test -f engine/firefox/obj-aarch64-apple-ios/dist/bin/XUL

      - name: Build Gecko
        if: steps.gecko_dist.outputs.cache-hit != 'true'
        env:
          CC: clang
          CXX: clang++
          LD: ld64.lld
        run: ./tools/development/build-gecko.sh ${{ matrix.build_args }}

      - name: Package Gecko SDK for later UI builds
        id: package_gecko
        if: steps.gecko_dist.outputs.cache-hit != 'true'
        continue-on-error: true
        run: tar -chzf "$RUNNER_TEMP/reynard-gecko-dist.tar.gz" -C engine/firefox/obj-aarch64-apple-ios/dist bin include

      - name: Save packaged Gecko SDK
        if: steps.gecko_dist.outputs.cache-hit != 'true' && steps.package_gecko.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/reynard-gecko-dist.tar.gz
          key: ${{ steps.gecko_dist.outputs.cache-primary-key }}

      - name: Build idevice support library
        run: ./tools/development/build-idevice.sh

      - name: Install packaging dependencies
        run: brew install ldid

      - name: Build app
        run: ./tools/release/build-app.sh --no-signing ${{ inputs.nightly && '--nightly' || '' }}

      - name: Create IPA
        if: ${{ matrix.variant == 'standard' && inputs.build_normal_ipa }}
        run: ./tools/release/create-ipa.sh

      - name: Create TrollStore TIPA
        if: ${{ matrix.variant == 'standard' && inputs.build_trollstore_tipa }}
        run: ./tools/release/create-ipa.sh --trollstore

      - name: Create Jailbroken IPA
        if: ${{ matrix.variant == 'nojemalloc' && inputs.build_jailbroken_ipa }}
        run: ./tools/release/create-ipa.sh --jailbroken

      - name: Upload IPA
        if: ${{ matrix.variant == 'standard' && inputs.build_normal_ipa }}
        uses: actions/upload-artifact@v4
        with:
          name: Reynard-Fennec-SideStore
          path: dist/Reynard.ipa
          if-no-files-found: error

      - name: Upload TrollStore TIPA
        if: ${{ matrix.variant == 'standard' && inputs.build_trollstore_tipa }}
        uses: actions/upload-artifact@v4
        with:
          name: Reynard-TrollStore.tipa
          path: dist/Reynard-TrollStore.tipa
          if-no-files-found: error

      - name: Upload Jailbroken IPA
        if: ${{ matrix.variant == 'nojemalloc' && inputs.build_jailbroken_ipa }}
        uses: actions/upload-artifact@v4
        with:
          name: Reynard-Jailbroken.ipa
          path: dist/Reynard-Jailbroken.ipa
          if-no-files-found: error
