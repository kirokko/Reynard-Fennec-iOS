name: Build Reynard

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Git ref to build
        required: true
        type: string
      nightly:
        description: Build nightly version
        default: false
        type: boolean
      build_normal_ipa:
        description: Build normal IPA
        default: true
        type: boolean
      build_trollstore_tipa:
        description: Build TrollStore TIPA
        default: true
        type: boolean
      build_jailbroken_ipa:
        description: Build Jailbroken IPA
        default: true
        type: boolean
      test_strategy:
        description: 'auto, full, or explicit light (source/Foundation/parse always required)'
        default: auto
        type: string
      rebuild_native:
        description: Ignore binary SDK/idevice caches and exercise real source builds
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  prepare:
    name: Select build variants
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      should_build: ${{ steps.matrix.outputs.should_build }}
    steps:
      - name: Select matrix
        id: matrix
        uses: actions/github-script@v9
        env:
          BUILD_NORMAL_IPA: ${{ inputs.build_normal_ipa }}
          BUILD_TROLLSTORE_TIPA: ${{ inputs.build_trollstore_tipa }}
          BUILD_JAILBROKEN_IPA: ${{ inputs.build_jailbroken_ipa }}
        with:
          script: |
            const variants = [];
            if (process.env.BUILD_NORMAL_IPA === 'true' || process.env.BUILD_TROLLSTORE_TIPA === 'true') {
              variants.push({variant: 'standard', build_args: '--use-sccache --auto-clobber', sccache_namespace: 'standard'});
            }
            if (process.env.BUILD_JAILBROKEN_IPA === 'true') {
              variants.push({variant: 'nojemalloc', build_args: '--disable-jemalloc --use-sccache --auto-clobber', sccache_namespace: 'nojemalloc'});
            }
            core.setOutput('matrix', JSON.stringify({include: variants}));
            core.setOutput('should_build', String(variants.length > 0));

  build:
    needs: prepare
    if: ${{ needs.prepare.outputs.should_build == 'true' }}
    name: "${{ matrix.variant == 'standard' && 'Build standard engine and SideStore IPA' || 'Build Jailbroken' }}"
    runs-on: macos-26
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_VERSION: ${{ matrix.sccache_namespace }}
      REYNARD_DERIVED_DATA: ${{ github.workspace }}/.ci-derived-data
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref }}
          fetch-depth: 1
          submodules: false
      - name: Set up pinned Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - name: Required validation (existing UIKit mechanism)
        id: checks
        timeout-minutes: 16
        uses: ./.github/actions/browser-checks
        with:
          strategy: ${{ inputs.test_strategy }}
          artifact_name: ${{ matrix.variant == 'standard' && 'ieynec-ui-checks' || 'ieynec-ui-checks-nojemalloc' }}
      # Pin the same Rust release used by #22/#26; do not invalidate SDKs daily.
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          targets: aarch64-apple-ios
      - name: Identify native and Xcode cache inputs before submodules
        id: keys
        env:
          ENGINE_HASH: ${{ hashFiles('engine/release.txt', 'patches/**', 'tools/development/build-gecko.sh') }}
          SDK_EXPORT_HASH: ${{ hashFiles('tools/ci/NativeSDK.mjs', 'tools/ci/CachePayload.mjs') }}
          IDEVICE_HASH: ${{ hashFiles('tools/development/build-idevice.sh', 'tools/ci/NativeLibrary.mjs', 'tools/ci/CachePayload.mjs') }}
          PROJECT_HASH: ${{ hashFiles('browser/Reynard.xcodeproj/**', 'browser/Configuration/**', 'browser/Scripts/**', 'tools/release/build-app.sh', 'tools/ci/SourceTimes.mjs') }}
          VARIANT: ${{ matrix.variant }}
          NIGHTLY: ${{ inputs.nightly }}
        run: |
          rust_hash=$(rustc -Vv | shasum -a 256 | cut -d ' ' -f1)
          xcode_hash=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f1)
          sdk_hash=$(xcrun --sdk iphoneos --show-sdk-build-version | shasum -a 256 | cut -d ' ' -f1)
          engine_sha=$(git rev-parse HEAD:engine/firefox)
          idevice_sha=$(git rev-parse HEAD:support/idevice)
          base="${RUNNER_OS}-${RUNNER_ARCH}-${VARIANT}-${engine_sha}-${xcode_hash}-${rust_hash}-${ENGINE_HASH}"
          sdk_key="gecko-sdk-v2-${base}-${SDK_EXPORT_HASH}"
          idevice_key="idevice-binary-v1-${RUNNER_OS}-${RUNNER_ARCH}-${idevice_sha}-${xcode_hash}-${sdk_hash}-${rust_hash}-${IDEVICE_HASH}"
          native_hash=$(printf '%s\n%s' "$sdk_key" "$idevice_key" | shasum -a 256 | cut -d ' ' -f1)
          echo "sdk_key=$sdk_key" >> "$GITHUB_OUTPUT"
          echo "legacy_sdk_key=gecko-sdk-v1-${base}" >> "$GITHUB_OUTPUT"
          echo "idevice_key=$idevice_key" >> "$GITHUB_OUTPUT"
          echo "rust_hash=$rust_hash" >> "$GITHUB_OUTPUT"
          echo "xcode_prefix=xcode-v1-${RUNNER_OS}-${RUNNER_ARCH}-${xcode_hash}-${sdk_hash}-${native_hash}-${PROJECT_HASH}-${NIGHTLY}-" >> "$GITHUB_OUTPUT"
          echo "SDK_KEY=$sdk_key" >> "$GITHUB_ENV"
          echo "LEGACY_SDK_KEY=gecko-sdk-v1-${base}" >> "$GITHUB_ENV"
          echo "IDEVICE_KEY=$idevice_key" >> "$GITHUB_ENV"
          echo "ENGINE_SHA=$engine_sha" >> "$GITHUB_ENV"
          echo "BUILD_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Restore packaged Gecko SDK before source preparation
        id: gecko_dist
        if: ${{ !inputs.rebuild_native }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/reynard-gecko-dist.tar.gz
          key: ${{ steps.keys.outputs.sdk_key }}
          restore-keys: ${{ steps.keys.outputs.legacy_sdk_key }}
      - name: Validate SDK or select source-build fallback
        id: sdk
        env:
          MATCHED_KEY: ${{ steps.gecko_dist.outputs.cache-matched-key }}
          GH_TOKEN: ${{ github.token }}
        run: node tools/ci/NativeSDK.mjs restore
      - name: Restore precompiled idevice library
        id: idevice_cache
        if: ${{ !inputs.rebuild_native }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ieynec-idevice
          key: ${{ steps.keys.outputs.idevice_key }}
      - name: Validate idevice binary or select real build
        id: idevice
        env:
          CACHE_HIT: ${{ steps.idevice_cache.outputs.cache-hit }}
        run: node tools/ci/NativeLibrary.mjs restore
      - name: Install Gecko-only build dependencies
        if: steps.sdk.outputs.ready != 'true'
        run: |
          brew install python@3.12 lld cbindgen llvm
          echo "$(brew --prefix python@3.12)/libexec/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      - name: Initialize required submodules only on native misses
        if: steps.sdk.outputs.ready != 'true' || steps.idevice.outputs.ready != 'true'
        env:
          NEED_GECKO: ${{ steps.sdk.outputs.ready != 'true' }}
          NEED_IDEVICE: ${{ steps.idevice.outputs.ready != 'true' }}
        run: |
          if [[ "$NEED_IDEVICE" == true ]]; then
            git submodule sync -- support/idevice
            git submodule update --init --recursive support/idevice
          fi
          if [[ "$NEED_GECKO" == true ]]; then
            git submodule sync -- engine/firefox
            git submodule update --init --depth 1 engine/firefox
          fi
      - name: Update Gecko source
        if: steps.sdk.outputs.ready != 'true'
        run: ./tools/development/update-gecko.sh
      - name: Apply Gecko patches
        if: steps.sdk.outputs.ready != 'true'
        run: ./tools/development/apply-patches.sh
      - name: Restore Gecko dependency cache only for source build
        if: steps.sdk.outputs.ready != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.mozbuild
          key: buildcache-gecko-deps-${{ matrix.variant }}-${{ steps.keys.outputs.rust_hash }}-${{ hashFiles('engine/release.txt') }}
          restore-keys: buildcache-gecko-deps-${{ matrix.variant }}-${{ steps.keys.outputs.rust_hash }}-
      - name: Restore Cargo downloads for idevice-only miss
        if: steps.sdk.outputs.ready == 'true' && steps.idevice.outputs.ready != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: idevice-cargo-v1-${{ steps.keys.outputs.idevice_key }}
          restore-keys: idevice-cargo-v1-
      - name: Set up sccache for real native builds
        if: steps.sdk.outputs.ready != 'true' || steps.idevice.outputs.ready != 'true'
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Build Gecko on SDK miss
        if: steps.sdk.outputs.ready != 'true'
        env:
          CC: clang
          CXX: clang++
          LD: ld64.lld
        run: ./tools/development/build-gecko.sh ${{ matrix.build_args }}
      - name: Export self-contained Gecko SDK (including source theme)
        if: steps.sdk.outputs.source != 'v2'
        run: node tools/ci/NativeSDK.mjs pack
      - name: Save complete Gecko SDK
        if: steps.sdk.outputs.source != 'v2'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/reynard-gecko-dist.tar.gz
          key: ${{ steps.keys.outputs.sdk_key }}
      - name: Build idevice support library on binary miss
        if: steps.idevice.outputs.ready != 'true'
        run: ./tools/development/build-idevice.sh
      - name: Export validated idevice binary
        if: steps.idevice.outputs.ready != 'true'
        run: node tools/ci/NativeLibrary.mjs pack
      - name: Save precompiled idevice library
        if: steps.idevice.outputs.ready != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ieynec-idevice
          key: ${{ steps.keys.outputs.idevice_key }}
      - name: Restore compatible Xcode DerivedData
        id: xcode_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ci-derived-data
          key: ${{ steps.keys.outputs.xcode_prefix }}${{ env.BUILD_COMMIT }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.keys.outputs.xcode_prefix }}
      - name: Restore timestamps only for content-identical sources
        run: node tools/ci/SourceTimes.mjs restore
      - name: Install packaging dependencies for original non-SideStore modes
        if: inputs.build_trollstore_tipa || inputs.build_jailbroken_ipa
        run: brew install ldid
      - name: Build app (fresh archive, incremental compilation)
        id: app
        run: |
          ./tools/release/build-app.sh --no-signing ${{ inputs.nightly && '--nightly' || '' }} 2>&1 | tee "$RUNNER_TEMP/reynard-app-build.log"
          node tools/ci/SourceTimes.mjs save
      - name: Save successful Xcode build intermediates
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ci-derived-data
          key: ${{ steps.keys.outputs.xcode_prefix }}${{ env.BUILD_COMMIT }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Create IPA
        if: ${{ matrix.variant == 'standard' && inputs.build_normal_ipa }}
        run: ./tools/release/create-ipa.sh
      - name: Create TrollStore TIPA
        if: ${{ matrix.variant == 'standard' && inputs.build_trollstore_tipa }}
        run: ./tools/release/create-ipa.sh --trollstore
      - name: Create Jailbroken IPA
        if: ${{ matrix.variant == 'nojemalloc' && inputs.build_jailbroken_ipa }}
        run: ./tools/release/create-ipa.sh --jailbroken
      - name: Verify all newly packaged products and exact source commit
        id: products
        env:
          EXPECTED_COMMIT: ${{ env.BUILD_COMMIT }}
        run: |
          for product in dist/*.ipa dist/*.tipa; do
            [[ -f "$product" ]] || continue
            python3 tools/ci/Verify-IPA.py "$product"
          done
      - name: Upload IPA
        if: ${{ matrix.variant == 'standard' && inputs.build_normal_ipa }}
        uses: actions/upload-artifact@v4
        with:
          name: Reynard-Fennec-SideStore
          compression-level: 0 # IPA is already compressed; avoid compressing twice.
          path: |
            dist/Reynard.ipa
            dist/Reynard.ipa.provenance.json
          if-no-files-found: error
      - name: Upload TrollStore TIPA
        if: ${{ matrix.variant == 'standard' && inputs.build_trollstore_tipa }}
        uses: actions/upload-artifact@v4
        with:
          name: Reynard-TrollStore.tipa
          compression-level: 0
          path: |
            dist/Reynard-TrollStore.tipa
            dist/Reynard-TrollStore.tipa.provenance.json
          if-no-files-found: error
      - name: Upload Jailbroken IPA
        if: ${{ matrix.variant == 'nojemalloc' && inputs.build_jailbroken_ipa }}
        uses: actions/upload-artifact@v4
        with:
          name: Reynard-Jailbroken.ipa
          compression-level: 0
          path: |
            dist/Reynard-Jailbroken.ipa
            dist/Reynard-Jailbroken.ipa.provenance.json
          if-no-files-found: error
      - name: Build cache summary
        if: always()
        env:
          SDK_SOURCE: ${{ steps.sdk.outputs.source }}
          IDEVICE_REUSED: ${{ steps.idevice.outputs.ready }}
          XCODE_MATCH: ${{ steps.xcode_cache.outputs.cache-matched-key }}
          UIKIT: ${{ steps.checks.outputs.uikit }}
          VERIFIED: ${{ steps.products.outcome }}
        run: |
          {
            echo '## Build inputs and cache decisions'
            echo "Commit: $BUILD_COMMIT"
            echo "Gecko: $SDK_SOURCE; idevice reused: $IDEVICE_REUSED"
            echo "Xcode compatible snapshot: ${XCODE_MATCH:-miss}"
            echo "UIKit: $UIKIT"
            if [[ "$VERIFIED" == success ]]; then
              echo 'Newly packaged products passed commit/plist/hash verification. Download only if this run also completes successfully.'
            else
              echo 'NO verified new IPA: inspect the actual failure; earlier successful runs are rollbacks only.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload build diagnostics (not an IPA)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-${{ matrix.variant }}
          path: ${{ runner.temp }}/reynard-app-build.log
          if-no-files-found: ignore
