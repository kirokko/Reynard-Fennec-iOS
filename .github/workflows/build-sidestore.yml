name: Build SideStore IPA (manual)
run-name: ${{ inputs.ublock_port_checks_only && 'Full uBO WebKit port experiment (no IPA)' || inputs.webkit_checks_only && 'WebKit migration feasibility (no IPA)' || inputs.ui_checks_only && 'UIKit UI checks (no IPA)' || 'Build SideStore IPA (manual)' }}

# Entry point on this fork's default branch (fennec-ios).
# Do not spend macOS runner time on every UI edit. This builds the standard
# variant only; SideStore performs the final development signing on-device.
on:
  workflow_dispatch:
    inputs:
      ublock_port_checks_only:
        description: 'Unofficial full-uBO source port: compiler/native DNR/background/UI experiment; no IPA'
        type: boolean
        default: false
      webkit_checks_only:
        description: 'Isolated WebKit engine/native extensions feasibility gate; does not build an IPA'
        type: boolean
        default: false
      ui_checks_only:
        description: 'Run UIKit regression checks and review screenshots without rebuilding the IPA'
        type: boolean
        default: false
      test_strategy:
        description: 'auto: reuse identical passed UIKit inputs; full: rerun all; light: explicit no-simulator checks'
        type: choice
        options: [auto, full, light]
        default: auto
      rebuild_native:
        description: 'Slow validation: bypass Gecko SDK and idevice binary caches, build from source'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Native-recovery benchmarking must not queue/block an ordinary feature IPA.
  # Runners/workspaces/artifacts are isolated; immutable caches are safe to share.
  group: sidestore-${{ github.ref }}-${{ inputs.ui_checks_only }}-${{ inputs.rebuild_native }}
  cancel-in-progress: false

jobs:
  ublock_port_checks:
    if: ${{ inputs.ublock_port_checks_only }}
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - name: Check original production baseline and policies
        run: |
          node tools/ci/WebKitBaseline.mjs
          node --test tests/*.test.mjs
      - name: Compile actual full-uBO modules and run native WebKit port experiment
        run: bash tools/ci/Test-UBlockPort.sh
      - name: Preserve port evidence even when unsupported
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-ubo-webkit-port
          path: ${{ runner.temp }}/reynard-ubo-port-results

  webkit_checks:
    if: ${{ inputs.webkit_checks_only && !inputs.ublock_port_checks_only }}
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - name: Check original production baseline and existing source policies
        run: |
          node tools/ci/WebKitBaseline.mjs
          node --test tests/*.test.mjs
      - name: Compile iPhone sources and run real WebKit integration probes
        run: bash tools/ci/Test-WebKit.sh
      - name: Preserve exact SDK and runtime findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-feasibility
          path: ${{ runner.temp }}/reynard-webkit-smoke/results

  ui_checks:
    if: ${{ inputs.ui_checks_only && !inputs.webkit_checks_only && !inputs.ublock_port_checks_only }}
    runs-on: macos-26
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      # An explicit UI-only request still executes the simulator suite; no IPA.
      - uses: ./.github/actions/browser-checks
        with:
          strategy: full

  build:
    if: ${{ !inputs.ui_checks_only && !inputs.webkit_checks_only && !inputs.ublock_port_checks_only }}
    uses: ./.github/workflows/build.yml
    with:
      checkout_ref: ${{ github.sha }}
      nightly: false
      build_normal_ipa: true
      build_trollstore_tipa: false
      build_jailbroken_ipa: false
      test_strategy: ${{ inputs.test_strategy }}
      rebuild_native: ${{ inputs.rebuild_native }}
