name: Build SideStore IPA (manual)
run-name: ${{ inputs.ui_checks_only && 'UIKit UI checks (no IPA)' || 'Build SideStore IPA (manual)' }}

# Entry point on this fork's default branch (fennec-ios).
# Do not spend macOS runner time on every UI edit. This builds the standard
# variant only; SideStore performs the final development signing on-device.
on:
  workflow_dispatch:
    inputs:
      ui_checks_only:
        description: 'Run UIKit regression checks and review screenshots without rebuilding the IPA'
        type: boolean
        default: false
      test_strategy:
        description: 'auto: reuse identical passed UIKit inputs; full: rerun all; light: explicit no-simulator checks'
        type: choice
        options: [auto, full, light]
        default: auto
      rebuild_native:
        description: 'Slow validation: bypass Gecko SDK and idevice binary caches, build from source'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sidestore-${{ github.ref }}-${{ inputs.ui_checks_only }}
  cancel-in-progress: false

jobs:
  ui_checks:
    if: ${{ inputs.ui_checks_only }}
    runs-on: macos-26
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      # An explicit UI-only request still executes the simulator suite; no IPA.
      - uses: ./.github/actions/browser-checks
        with:
          strategy: full

  build:
    if: ${{ !inputs.ui_checks_only }}
    uses: ./.github/workflows/build.yml
    with:
      checkout_ref: ${{ github.sha }}
      nightly: false
      build_normal_ipa: true
      build_trollstore_tipa: false
      build_jailbroken_ipa: false
      test_strategy: ${{ inputs.test_strategy }}
      rebuild_native: ${{ inputs.rebuild_native }}
